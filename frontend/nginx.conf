server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Бэкенд доступен только внутри docker-сети (сервис "backend"), наружу
    # смотрит только этот nginx — поэтому весь API проксируется под тем же
    # origin, что и статика, и снаружи виден единственный адрес http://localhost.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
