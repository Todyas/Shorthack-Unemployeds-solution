services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-b1gcckd2llp6t0dj6j6e}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-deepseek-v4-flash/latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - backend_data:/data
    ports:
      # Не обязателен для http://localhost (nginx уже проксирует /api) — открыт
      # для удобства: прямой доступ к /docs и для фронтенда, запущенного через
      # `npm run dev` отдельно от docker compose (VITE_API_BASE_URL по
      # умолчанию смотрит на localhost:8000).
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./supportpilot-react
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
